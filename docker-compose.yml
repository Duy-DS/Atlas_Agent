services:
  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: atlas-llama
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${LLAMA_MODEL_PATH:-./models}:/models:ro
    command: ["-m", "/models/${MODEL_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  app:
    build:
      context: .
    container_name: atlas_agent
    depends_on:
      llama:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./chroma-data:/app/chroma-data
    environment:
      - PYTHONUNBUFFERED=1
      - LLAMA_BASE_URL=http://llama:8080/v1
      - MODEL_NAME=${MODEL_NAME:-qwen3.5:4b}
      - BATCH_SIZE=${BATCH_SIZE:-20}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-512}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-false}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-duckduckgo}
      - WEB_SEARCH_ENDPOINT=${WEB_SEARCH_ENDPOINT:-}
      - INPUT_CSV=${INPUT_CSV:-/app/data/public_test.csv}
      - OUTPUT_CSV=${OUTPUT_CSV:-/app/output/pred.csv}
      - AUDIT_CSV=${AUDIT_CSV:-/app/output/pred_audit.csv}
      - APP_MODE=python
    restart: "no"
