version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    # Remove deploy if your development machine doesn't have an Nvidia GPU setup
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: agent_app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b
      - OFFLINE_MODE=false
    depends_on:
      - ollama
    volumes:
      - .:/app
