services:
  ollama:
    image: ollama/ollama:latest
    container_name: atlas-ollama
    restart: "no"
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

  ollama-pull:
    image: curlimages/curl:latest
    container_name: atlas-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - MODEL_NAME=${MODEL_NAME:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model: $$MODEL_NAME"
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$MODEL_NAME\"}" \
          --max-time 1800
        
        echo "Verifying model is available..."
        until curl -fsS http://ollama:11434/api/tags | grep -q "\"name\":\"$$MODEL_NAME\""; do
          echo "Model not ready yet, waiting..."
          sleep 5
        done
        echo "Model $$MODEL_NAME is ready!"
    restart: "no"

  app:
    image: thanhle0205/atlas:latest
    container_name: atlas_agent
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
      - ./chroma-data:/app/chroma-data
    environment:
      - PYTHONUNBUFFERED=1
      - LLAMA_BASE_URL=http://ollama:11434/v1
      - MODEL_NAME=${MODEL_NAME:-qwen3.5:4b}
      - BATCH_SIZE=${BATCH_SIZE:-20}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-512}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-false}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-duckduckgo}
      - WEB_SEARCH_ENDPOINT=${WEB_SEARCH_ENDPOINT:-}
      - INPUT_CSV=${INPUT_CSV:-/app/data/public_test.csv}
      - OUTPUT_CSV=${OUTPUT_CSV:-/app/output/pred.csv}
      - AUDIT_CSV=${AUDIT_CSV:-/app/output/pred_audit.csv}
      - APP_MODE=python
    restart: "no"
