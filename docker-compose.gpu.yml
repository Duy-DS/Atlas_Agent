services:
  app:
    build:
      context: .
    gpus: all
    container_name: atlas-agent
    volumes:
      - ./data:/data:ro
      - ./output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LLM_BACKEND: ollama
      LLM_BASE_URL: http://127.0.0.1:11434/v1
      LLM_MODEL_NAME: ${MODEL_NAME:-qwen3.5:0.8b}
      LLM_API_KEY: EMPTY
      LLM_CONCURRENCY_LIMIT: ${CONCURRENCY_LIMIT:-5}

  ollama:
    image: ollama/ollama:latest
    container_name: atlas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-5}
      OLLAMA_MAX_VRAM: ${OLLAMA_MAX_VRAM:-12G}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
