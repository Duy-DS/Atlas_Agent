services:
  app:
    build:
      context: .
    container_name: atlas-agent
    volumes:
      - ./data:/data:ro
      - ./output:/output
    environment:
      PYTHONUNBUFFERED: "1"
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://127.0.0.1:11434/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3.5:4b}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_CONCURRENCY_LIMIT: ${LLM_CONCURRENCY_LIMIT:-8}
      MODEL_NAME: ${MODEL_NAME:-qwen3.5:4b}
      BATCH_SIZE: ${BATCH_SIZE:-20}
      INPUT_CSV: ${INPUT_CSV:-/data/public_test.csv}
      OUTPUT_CSV: ${OUTPUT_CSV:-/output/pred.csv}
      AUDIT_CSV: ${AUDIT_CSV:-/output/pred_audit.csv}
      APP_MODE: python
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    container_name: atlas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-5}
      OLLAMA_MAX_VRAM: ${OLLAMA_MAX_VRAM:-12G}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
